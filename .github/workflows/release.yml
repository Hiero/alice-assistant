# Publishes a release when a version tag (like v0.2.0) is pushed: the source and the phone app.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALICE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alice.jks"
          echo "ALICE_KEYSTORE=$RUNNER_TEMP/alice.jks" >> "$GITHUB_ENV"
      - name: Phone app
        working-directory: android
        env:
          ALICE_KEYSTORE_PASSWORD: ${{ secrets.ALICE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../alice-phone-${GITHUB_REF_NAME}.apk"
      - name: Desktop app source
        run: git archive --format=tar.gz --prefix="alice-${GITHUB_REF_NAME}/" -o "alice-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            alice-${{ github.ref_name }}.tar.gz
            alice-phone-${{ github.ref_name }}.apk
