# Checks the desktop app and builds the phone app on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the backend
        working-directory: backend
        run: uv sync --python 3.12 --locked
      - name: Lint (errors only)
        run: uvx ruff check --isolated --select E9,F backend tools
      - name: Every module imports
        working-directory: backend
        env:
          XDG_RUNTIME_DIR: /tmp  # set in any desktop session, but not on a build machine
        run: |
          uv run python - <<'PY'
          import importlib, pkgutil
          import alice
          for module in pkgutil.iter_modules(alice.__path__):
              importlib.import_module(f"alice.{module.name}")
              print("ok", module.name)
          PY
      - name: The installer and shell files are valid
        run: |
          bash -n install.sh
          test -s shell/shaders/rig.frag.qsb

  android:
    name: Phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALICE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alice.jks"
          echo "ALICE_KEYSTORE=$RUNNER_TEMP/alice.jks" >> "$GITHUB_ENV"
      - name: Unit tests and APK
        working-directory: android
        env:
          ALICE_KEYSTORE_PASSWORD: ${{ secrets.ALICE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: alice-phone-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
