[project]
name = "alice-backend"
version = "0.1.0"
description = "Local assistant backend for the Alice desktop companion"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=1.60", "faster-whisper>=1.1", "kokoro-onnx>=0.5", "numpy", "ddgs>=9"]

[project.scripts]
alice-backend = "alice.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alice"]
